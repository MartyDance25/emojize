
name: Build Mac Program

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyinstaller emoji

      - name: Build
        run: pyinstaller --onefile emojize.py

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: emojize-mac
          path: dist/emojize
